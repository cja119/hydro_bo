Time:
  grid0: 24
  grid1: 24
  total_duration: 2160
  forecast_horizon: 168

Sets:
  ships: ["small", "medium", "large"]

param_source:
  planning_model:
    - compression_capacity
    - capex
    - conversion_trains_number
    - electrolyser_capacity
    - fuelcell_capacity
    - hydrogen_storage_capacity
    - opex
    - renewable_energy_capacity
    - renewables
    - vector_storage_capacity
    - hydrogen_storage_lower_backoff
    - hydrogen_storage_upper_backoff
    - vector_storage_lower_backoff
    - vector_storage_upper_backoff
    - expected_arrival_offset
    - single_train_limit_conversion   # per-train throughput [t carrier/h]; defaults to the h2_plan value

  default_data:
    electrolysis_efficiency: ["efficiencies", "electrolysers", "SOFC"]
    electrolysis_compression_penalty: ["miscillaneous", "electrolyser_compression_energy", "SOFC"]
    vector_synthetic_efficiency: ["efficiencies", "vector_synthesis"]
    production_compression_penalty: ["miscillaneous", "vector_compression_penalty"]
    storage_compression_penalty: ["miscillaneous", "storage_compression_penalty"]
    compression_efficiency: ["efficiencies", "compressor"]
    fuelcell_efficiency: ["efficiencies", "fuel_cell"]
    variable_energy_penalty_conversion: ["vector_production", "variable_energy_penalty"]
    calorific_value: ["efficiencies", "vector_calorific_value"]
    fixed_energy_penalty_conversion: ["vector_production", "fixed_energy_penalty"]
    single_train_limit_conversion: ["vector_production", "single_train_throughput"]
    conversion_fugitive_efficiency: ["efficiencies", "vector_fugitive"]
    ship_capacity: ["shipping", "storage_capacity_s"]
    ramp_down_limit: ["vector_production", "ramp_down_limit"]
    ramp_up_limit: ["vector_production", "ramp_up_limit"]
    ship_charge_limit: ["shipping", "loading_time"]
    ship_charter_rate: ["shipping", "charter_rate_s"]
    discount_factor: ["miscillaneous", "discount_factor"]
    minimum_train_throughput: ["vector_production", "minimum_train_throughput"]

formulations:
  primary: [
    "eqn1",
    "eqn2",
    "eqn3",
    "eqn4",
    "eqn5",
    "eqn6",
    "cons1",
    "cons2",
    "cons3",
    "cons4",
    "obj1"
    ]
  secondary: [
    "eqn1",
    "eqn2",
    "eqn3",
    "eqn4",
    "eqn5",
    "eqn6",
    "cons1",
    "cons2",
    "cons3",
    "cons4",
    "obj1"
    ]

solver:
  mip_gap: 0.005      # relative MIP gap (default 0.05)

logistics:
  integer_horizon: 504  # h; ship variables continuous after this (default 504)

contract:
  warm_up_days: 30      # days run before the evaluated year (default 30)

price_dynamics:
  enabled: true
  kappa: 1.94         # basis mean reversion speed (annual), NBP
  mu: 1.6094          # long-run mean of log-price (unused with the blue block)
  sigma: 0.344        # basis annual volatility, NBP
  lambda: 61.6        # basis jump intensity (jumps per year), NBP
  jump_mu: -0.0019    # mean basis jump size in log space, NBP
  jump_sigma: 0.0934  # basis jump size volatility in log space, NBP
  initial_price: 5.0  # starting price ($/kg) (unused with the blue block)
  blue:
    h: 0.175          # MMBtu/kg
    k: 0.91           # $/kg
    e: 0.00051        # tCO2/kg
    q: 0.0088         # tCO2 stored/kg
    c_TS: 20          # $/tCO2, transport and storage
    P_NG: 10.0        # $/MMBtu
    lambda: 250       # $/tCO2
  premium: 0.0        # green premium over blue ($/kg)
  penalty: 9.0        # cap on the premium in the spot price ($/kg)
